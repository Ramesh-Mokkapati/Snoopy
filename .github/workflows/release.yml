# Build packaged Snoopy apps and publish them as a GitHub Release.
#
#   git tag v1.0 && git push origin v1.0
#
# runs the tests (ci.yml), builds Windows and Linux packages with PyInstaller
# (Snoopy.spec) and attaches them to a "Snoopy v1.0" release. Running it by hand
# from the Actions tab builds the packages as downloadable artifacts only.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build-windows:
    name: Package for Windows
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build with PyInstaller
        run: python -m PyInstaller --noconfirm Snoopy.spec

      - name: Archive
        shell: pwsh
        run: Compress-Archive -Path dist/Snoopy -DestinationPath "Snoopy-${{ github.ref_name }}-windows-x64.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: snoopy-windows
          path: Snoopy-*-windows-x64.zip
          if-no-files-found: error

  build-linux:
    name: Package for Linux
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Same wxPython as the Linux CI job, plus what PyInstaller needs on Linux
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-venv python3-wxgtk4.0 binutils libpython3.12t64

      - name: Install build dependencies
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install -r requirements-build.txt

      - name: Build with PyInstaller
        run: .venv/bin/python -m PyInstaller --noconfirm Snoopy.spec

      - name: Archive
        run: tar -czf "Snoopy-${{ github.ref_name }}-linux-x64.tar.gz" -C dist Snoopy

      - uses: actions/upload-artifact@v7
        with:
          name: snoopy-linux
          path: Snoopy-*-linux-x64.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write     # needed to create the release
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" packages/*
          --repo "${{ github.repository }}"
          --title "Snoopy ${{ github.ref_name }}"
          --generate-notes

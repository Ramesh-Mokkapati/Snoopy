# Build and test Snoopy on Windows and Linux on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:      # "Run workflow" button on the Actions tab

permissions:
  contents: read

concurrency:              # a newer push to the same branch cancels the older run
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (Python 3.13)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile all sources
        run: python -m compileall -q SnoopyApp.py Utils docs

      # Includes local bash / cmd.exe / PowerShell runs (Git Bash is preinstalled)
      - name: Unit tests
        run: python -m Utils.TestApp

      - name: GUI smoke test
        run: python -m Utils.TestGUI

  linux:
    name: Linux (Ubuntu 24.04, distro wxPython)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The Linux install route from README.md: wxPython from the distribution,
      # everything else from requirements.txt (which skips wxPython on Linux).
      - name: Install wxPython and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-venv python3-wxgtk4.0 xvfb

      - name: Install dependencies
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install -r requirements.txt

      - name: Compile all sources
        run: .venv/bin/python -m compileall -q SnoopyApp.py Utils docs

      # Includes running remote scripts through a real bash over SSH
      - name: Unit tests
        run: .venv/bin/python -m Utils.TestApp

      - name: GUI smoke test
        run: xvfb-run -a -s "-screen 0 1280x800x24" .venv/bin/python -m Utils.TestGUI
